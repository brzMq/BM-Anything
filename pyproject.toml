[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bm-anything"
version = "0.1.0"
description = "BM-Anything: Local-first AI Capability Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BM-Anything" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "platformdirs>=4.3,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[project.entry-points."bm.capabilities"]
# Native registry path: capability_id = "module:provider_factory"
# Example (P2):
# "document.parse" = "bm_providers.document.parse:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/bm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bm"]
